[package]
name = "carmy-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
carmy = { path = "../crates/carmy", default-features = false, features = ["http"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt", "io-util", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# A separate workspace: fuzz targets build only with cargo-fuzz on nightly.
[workspace]
members = ["."]

[[bin]]
name = "console_protocol"
path = "fuzz_targets/console_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_execute"
path = "fuzz_targets/http_execute.rs"
test = false
doc = false
bench = false
