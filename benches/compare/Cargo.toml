[package]
name = "carmy-compare"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Comparison benchmarks: Carmy against other MCP and HTTP tool servers"

[dependencies]
carmy = { path = "../../crates/carmy" }
rmcp = { version = "3.4", default-features = false, features = ["server", "client", "macros", "schemars", "transport-io"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { workspace = true, features = ["process", "io-util"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
futures-util = "0.3"
