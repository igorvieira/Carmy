[package]
name = "carmy-openapi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Agent-native execution infrastructure: an OpenAPI description as Carmy tools"
readme = "../../README.md"
keywords = ["agents", "openapi", "tools", "mcp", "llm"]
categories = ["web-programming::http-client", "api-bindings"]

[dependencies]
carmy-core = { path = "../carmy-core", version = "0.6.0" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
serde_json.workspace = true

[dev-dependencies]
axum = "0.8"
carmy-runtime = { path = "../carmy-runtime", version = "0.6.0" }
tokio.workspace = true
