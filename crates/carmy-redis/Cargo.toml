[package]
name = "carmy-redis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Agent-native execution infrastructure: durable Redis stores for jobs and idempotency"
readme = "../../README.md"
keywords = ["agents", "redis", "jobs", "idempotency", "llm"]
categories = ["database", "asynchronous"]

[dependencies]
carmy-core = { path = "../carmy-core", version = "0.5.0" }
carmy-runtime = { path = "../carmy-runtime", version = "0.5.0" }
carmy-jobs = { path = "../carmy-jobs", version = "0.5.0" }
chrono = { version = "0.4", features = ["serde"] }
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "aio", "script", "connection-manager", "tls-rustls", "tokio-rustls-comp"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
schemars.workspace = true
