[package]
name = "carmy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent-native execution infrastructure for Rust"
readme = "../../README.md"
keywords = ["agents", "llm", "tools", "mcp", "idempotency"]
categories = ["asynchronous", "web-programming"]

[features]
default = ["http", "mcp", "observability"]
http = ["dep:carmy-http", "dep:axum"]
mcp = ["dep:carmy-mcp"]
observability = ["dep:carmy-observability"]

[dependencies]
carmy-core = { path = "../carmy-core", version = "0.1.0" }
carmy-schema = { path = "../carmy-schema", version = "0.1.0" }
carmy-macros = { path = "../carmy-macros", version = "0.1.0" }
carmy-runtime = { path = "../carmy-runtime", version = "0.1.0" }
carmy-http = { path = "../carmy-http", version = "0.1.0", optional = true }
carmy-mcp = { path = "../carmy-mcp", version = "0.1.0", optional = true }
carmy-observability = { path = "../carmy-observability", version = "0.1.0", optional = true }
axum = { version = "0.8", optional = true }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio.workspace = true
linkme = "0.3"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
trybuild = "1"
