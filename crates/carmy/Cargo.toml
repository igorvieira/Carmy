[package]
name = "carmy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Agent-native execution infrastructure for Rust"
readme = "../../README.md"
keywords = ["agents", "llm", "tools", "mcp", "idempotency"]
categories = ["asynchronous", "web-programming"]

[features]
default = ["http", "mcp", "observability"]
# With `mcp`, also serves MCP over Streamable HTTP at /mcp.
http = ["dep:carmy-http", "dep:axum", "carmy-mcp?/http"]
mcp = ["dep:carmy-mcp"]
observability = ["dep:carmy-observability"]
postgres = ["dep:carmy-postgres"]
redis = ["dep:carmy-redis", "dep:chrono"]

[dependencies]
carmy-core = { path = "../carmy-core", version = "0.5.0" }
carmy-schema = { path = "../carmy-schema", version = "0.5.0" }
carmy-macros = { path = "../carmy-macros", version = "0.5.0" }
carmy-runtime = { path = "../carmy-runtime", version = "0.5.0" }
carmy-jobs = { path = "../carmy-jobs", version = "0.5.0" }
carmy-postgres = { path = "../carmy-postgres", version = "0.5.0", optional = true }
carmy-redis = { path = "../carmy-redis", version = "0.5.0", optional = true }
chrono = { version = "0.4", optional = true }
carmy-http = { path = "../carmy-http", version = "0.5.0", optional = true }
carmy-mcp = { path = "../carmy-mcp", version = "0.5.0", optional = true }
carmy-observability = { path = "../carmy-observability", version = "0.5.0", optional = true }
axum = { version = "0.8", optional = true }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std", "signal"] }
linkme = "0.3"
futures-util = "0.3"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
rmcp = { version = "3.4", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
trybuild = "1"
axum = "0.8"
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
sha2 = "0.10"
tower = { version = "0.5", features = ["util"] }
