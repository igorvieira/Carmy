[package]
name = "carmy-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Agent-native execution infrastructure: MCP adapter"
readme = "../../README.md"
keywords = ["mcp", "model-context", "agents", "llm", "tools"]
categories = ["asynchronous", "network-programming"]


[dependencies]
carmy-core = { path = "../carmy-core", version = "0.3.0" }
carmy-runtime = { path = "../carmy-runtime", version = "0.3.0" }
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-io"] }
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
rmcp = { version = "3.4", default-features = false, features = ["client", "server"] }
schemars.workspace = true
serde.workspace = true
