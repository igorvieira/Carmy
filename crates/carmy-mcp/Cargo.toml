[package]
name = "carmy-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Agent-native execution infrastructure: MCP adapter"
readme = "../../README.md"
keywords = ["mcp", "model-context", "agents", "llm", "tools"]
categories = ["asynchronous", "network-programming"]


[features]
# MCP over Streamable HTTP, mountable in any Axum/tower router.
http = ["rmcp/transport-streamable-http-server", "dep:http"]

[dependencies]
carmy-core = { path = "../carmy-core", version = "0.6.1" }
carmy-runtime = { path = "../carmy-runtime", version = "0.6.1" }
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-io", "elicitation"] }
futures-util = "0.3"
http = { version = "1", optional = true }
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
rmcp = { version = "3.4", default-features = false, features = ["client", "server", "elicitation"] }
schemars.workspace = true
serde.workspace = true
