[package]
name = "carmy-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Agent-native execution infrastructure: http"
readme = "../../README.md"
keywords = ["agents", "http", "sse", "llm", "tools"]
categories = ["web-programming::http-server", "asynchronous"]


[dependencies]
carmy-core = { path = "../carmy-core", version = "0.4.0" }
carmy-runtime = { path = "../carmy-runtime", version = "0.4.0" }
axum = "0.8"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "http1", "http2", "tokio", "service"] }
tower-http = { version = "0.6", features = ["cors", "set-header", "timeout"] }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
subtle = "2"

[dev-dependencies]
schemars.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hmac = "0.12"
hex = "0.4"
