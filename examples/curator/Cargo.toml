[package]
name = "curator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Durable stores: `DATABASE_URL=postgres://... cargo run -p curator --features postgres`
postgres = ["carmy/postgres"]

[dependencies]
carmy = { path = "../../crates/carmy" }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

[dev-dependencies]
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
sha2 = "0.10"
tower = { version = "0.5", features = ["util"] }
