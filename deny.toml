# cargo-deny: known vulnerabilities, licenses and dependency sources.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace crates referenced by path only (examples, benches, dev-dependencies).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
