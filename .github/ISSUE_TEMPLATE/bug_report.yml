name: Bug report
description: Something in Carmy doesn't behave as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A tool definition and request (HTTP body or MCP call) that reproduces the problem.
      render: rust
  - type: input
    id: version
    attributes:
      label: Carmy version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options: [HTTP, MCP, in-process runtime, not applicable]
  - type: input
    id: rust
    attributes:
      label: Rust version (`rustc --version`)
