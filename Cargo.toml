[workspace]
members = ["crates/*", "examples/*", "benches", "benches/compare"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/igorvieira/Carmy"
homepage = "https://carmy-pi.vercel.app"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-std"] }
tokio-util = "0.7"
tracing = "0.1"

# Until `ValidationOptions::should_validate_schema` is released upstream:
# https://github.com/Stranger6667/jsonschema/pull/1666
[patch.crates-io]
jsonschema = { git = "https://github.com/igorvieira/jsonschema", branch = "should-validate-schema" }
